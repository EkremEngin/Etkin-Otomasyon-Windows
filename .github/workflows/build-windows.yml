name: Windows exe

# NEDEN VAR: 'Etkin Otomasyon.exe' bir BUILD ÇIKTISIDIR — kodu güncelleyip depoyu yenilemek onu
# DEĞİŞTİRMEZ, içine build günündeki Python kodu gömülüdür. PyInstaller çapraz derleme yapmadığı için
# exe ancak bir Windows makinede üretilebilir. Bu iş akışı o makineyi GitHub'dan kiralar: her push'ta
# exe'yi derler, açılıp açılmadığını sınar ve indirilebilir bir dosya olarak bırakır.
#
# NASIL İNDİRİLİR: depo sayfası → üstteki "Actions" sekmesi → en üstteki koşu → sayfanın altındaki
# "Artifacts" kutusundan "Etkin-Otomasyon-exe". GitHub artifact'ları ZIP'ler; indirip çıkart, içinden
# 'Etkin Otomasyon.exe' çıkar. Onu proje KÖKÜNE koy (Codes'un yanına), 'dist' klasöründen çalıştırma:
# uygulama resume/done dosyalarını kendi durduğu klasöre yazar, yanlış klasör = MÜKERRER PORTAL KAYDI.

on:
  push:
    branches: [main]
    paths:
      - 'Codes/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Test edilen Windows EXE dosyasını GitHub Release olarak yayımla
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest         # ŞART: .exe yalnız Windows'ta derlenir
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'    # 3.12+ gerekli; python.org dağıtımı (tkinter dahil gelir)

      - name: Bağımlılıklar
        working-directory: Codes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt
        # ⚠ '-r requirements.txt' ŞART: spec collect_all('customtkinter') çağırıyor, paketleri
        # tek tek kurmak yetmiyor. playwright TARAYICI indirmez (Chrome'a CDP ile bağlanıyoruz).

      - name: Hangi sürüm derleniyor?
        working-directory: Codes
        shell: python
        run: |
          import io, re
          k = io.open('izin_gui.py', encoding='utf-8').read()
          m = re.search(r'SURUM\s*=\s*"([^"]+)"', k)
          print('SURUM =', m.group(1) if m else 'BULUNAMADI')
        # Bu satır koşu log'una düşer → indirilen exe'nin hangi koda karşılık geldiği kayda geçer.

      - name: Windows kaynak ve izin belgesi testleri
        working-directory: Codes
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -v

      - name: Derle
        working-directory: Codes
        run: pyinstaller izin_app.spec --noconfirm
        # working-directory ŞART: spec 'assets/...' yollarını CWD'ye göre çözüyor, başka klasörden patlar.

      - name: Duman testi — exe açılıyor mu, kalıcı klasörü doğru mu?
        working-directory: Codes
        shell: pwsh
        run: |
          $exe = "dist\Etkin Otomasyon.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "exe üretilmedi: $exe" }
          "boyut: {0:N1} MB" -f ((Get-Item -LiteralPath $exe).Length / 1MB)
          # console=False (pencereli) exe olduğu için çıktısı konsola DÜŞMEZ; ölçtüğümüz şey çıkış kodu.
          # 'paths' token'ı GUI açmadan çalışır: donmuş exe kendini import edip dispatcher'a gider.
          # Sıfırdan farklı çıkış = eksik hidden import / bozuk bundle demektir (PyInstaller'ın en sık hatası).
          $p = Start-Process -FilePath $exe -ArgumentList "paths" -Wait -PassThru -NoNewWindow
          "çıkış kodu: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "exe 'paths' ile $($p.ExitCode) koduyla düştü — bundle bozuk." }

      - name: DGS Excel uyumluluğu — derlenmiş exe
        working-directory: Codes
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import json, pathlib, subprocess, tempfile
          from openpyxl import Workbook
          exe = pathlib.Path('dist/Etkin Otomasyon.exe').resolve()
          headers = ['AD SOYAD', 'TC Kimlik', 'BÖLÜM', 'Lokasyonu\nSGK',
                     'Ar-Ge/ Destek/ K.Dışı', 'Eksik Puantaj (Saat)', 'Proje Adı']
          # Tamamen yapay veri; çalışan dosyaları CI'a yüklenmez. liste modu portala bağlanmaz.
          with tempfile.TemporaryDirectory() as temp:
              for title in ['AĞUTOS', 'Sayfa1']:
                  wb = Workbook()
                  wb.active.title = title
                  wb.active.append(headers)
                  for park, tc in [('TPIz', '12345678901'), ('Ulutek', '22345678901')]:
                      wb.active.append(['ÖRNEK ' + park, tc, 'Bölüm', park,
                                        'Ar-Ge', 0, 'Örnek proje'])
                  wb.create_sheet('Özet').append(['Çalışan sayısı'])
                  path = pathlib.Path(temp) / (title + '.xlsx')
                  wb.save(path)
                  wb.close()
                  for park in ['TPIz', 'Ulutek']:
                      result = subprocess.run(
                          [str(exe), 'dgs', '--park', park, 'liste', '--excel', str(path),
                           '--donem', 'AĞUSTOS 2026'], cwd=temp, capture_output=True,
                          text=True, encoding='utf-8', errors='replace', timeout=60)
                      if result.returncode:
                          raise RuntimeError(result.stdout + result.stderr)
                      data = json.loads(result.stdout.split('<<<LISTE>>>', 1)[1])
                      assert data['sheet'] == 'Ağustos', data
                      assert len(data['kisiler']) == 1, data
                      assert data['kisiler'][0]['ad'] == 'ÖRNEK ' + park, data
                      print(f'PASS: {title} / {park}, dönem ve personel eşleşti')

      - name: Dijitalpark DGS ve izin taslakları — derlenmiş exe
        working-directory: Codes
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import datetime, json, os, pathlib, subprocess, tempfile
          from openpyxl import Workbook
          exe = pathlib.Path('dist/Etkin Otomasyon.exe').resolve()
          with tempfile.TemporaryDirectory() as temp:
              dgs = Workbook()
              ws = dgs.active
              ws.title = 'Page1'
              for col, header in {'A': 'TCKimlikNo', 'D': 'Personel',
                                  'K': 'Haftalık Çalışma Günü', 'L': 'Haftalık Çalışma Saati',
                                  'N': 'İstisnalı Çalışılan Toplam Süre',
                                  'O': 'Tam İstisna İçin Çalışılması Gereken Süre',
                                  'P': 'DGS Girilecek Süre', 'R': 'Yer Alınan Proje'}.items():
                  ws[f'{col}1'] = header
              for col, value in {'A': '10*******18', 'D': 'ÖRNEK KİŞİ', 'K': 5, 'L': 45,
                                 'N': '29:49', 'O': '198:00', 'P': '=O3-N3', 'R': 'Örnek proje'}.items():
                  ws[f'{col}3'] = value
              dgs.create_sheet('Page2').append(['Özet'])
              dgs_path = pathlib.Path(temp) / 'dijitalpark-dgs.xlsx'
              dgs.save(dgs_path)
              dgs.close()
              result = subprocess.run([str(exe), 'dgs', '--park', 'Dijitalpark', 'liste',
                                       '--excel', str(dgs_path), '--donem', 'EYLÜL 2026'],
                                      cwd=temp, capture_output=True, text=True, encoding='utf-8',
                                      errors='replace', timeout=60,
                                      env={**os.environ, 'DGS_EXPECTED_COMPANY': 'ÖRNEK PROJE A.Ş.'})
              if result.returncode:
                  raise RuntimeError(result.stdout + result.stderr)
              data = json.loads(result.stdout.split('<<<LISTE>>>', 1)[1])
              assert data['park'] == 'Dijitalpark' and len(data['kisiler']) == 1, data
              assert data['kisiler'][0]['eksik'] == '168:11', data
              blocked = subprocess.run([str(exe), 'dgs', '--park', 'Dijitalpark', 'giris',
                                        '--excel', str(dgs_path), '--donem', 'EYLÜL 2026', '--commit'],
                                       cwd=temp, capture_output=True, text=True, encoding='utf-8',
                                       errors='replace', timeout=60,
                                       env={k: v for k, v in os.environ.items()
                                            if k != 'DGS_EXPECTED_COMPANY'})
              assert blocked.returncode == 2 and 'beklenen tam firma unvanı' in blocked.stdout, blocked.stdout

              izin = Workbook()
              ws = izin.active
              ws.title = 'Tabelle1'
              ws.append([])
              ws.append([])
              ws.append([])
              ws.append([None, None, 'T.C.', 'Ad-Soyad', 'Tarih', 'Gün Sayısı'])
              ws.append([None, None, '31**', 'ÖRNEK KİŞİ', datetime.datetime(2026, 8, 13), 1])
              izin_path = pathlib.Path(temp) / 'dijitalpark-izin.xlsx'
              izin.save(izin_path)
              izin.close()
              result = subprocess.run([str(exe), 'orchestrator', '--excel', str(izin_path),
                                       '--parklar', 'DIJITALPARK', '--plan'], cwd=temp,
                                      capture_output=True, text=True, encoding='utf-8',
                                      errors='replace', timeout=60)
              if result.returncode:
                  raise RuntimeError(result.stdout + result.stderr)
              assert '1 kişi' in result.stdout and 'yalnız taslak' in result.stdout, result.stdout
              forms = pathlib.Path(temp) / 'Çalışan İzinleri'
              folder = forms / 'Örnek Kişi'
              folder.mkdir(parents=True)
              (folder / 'Yıllık İzin Formu.pdf').write_bytes(b'%PDF-1.4\n%%EOF')
              result = subprocess.run([str(exe), 'orchestrator', '--excel', str(izin_path),
                                       '--park', 'DIJITALPARK', '--kisi-belge-klasoru', str(forms),
                                       '--plan'], cwd=temp, capture_output=True, text=True,
                                      encoding='utf-8', errors='replace', timeout=60)
              assert result.returncode == 0, result.stdout + result.stderr
              assert '1/1' in result.stdout and str(pathlib.Path('Örnek Kişi/Yıllık İzin Formu.pdf')) in result.stdout, result.stdout
              print('PASS: Windows EXE Türkçe alt klasördeki doğru izin PDF dosyasını eşleştirdi')

      - uses: actions/upload-artifact@v4
        with:
          name: Etkin-Otomasyon-exe
          path: 'Codes/dist/Etkin Otomasyon.exe'
          if-no-files-found: error   # sessizce boş artifact bırakma
          retention-days: 30

  publish:
    name: Windows sürümünü yayımla
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish-windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Etkin-Otomasyon-exe
          path: release-dist
      - name: Doğrulanan EXE'yi ve SHA-256 özetini yayımla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^SURUM = "([0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?)".*/\1/p' Codes/izin_gui.py)
          [[ -n "$version" ]]
          tag="v${version//-/.}"
          asset=release-dist/Etkin-Otomasyon.exe
          mv 'release-dist/Etkin Otomasyon.exe' "$asset"
          (cd release-dist && sha256sum Etkin-Otomasyon.exe > SHA256SUMS.txt)
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]] || { echo 'main güncellendi; yeni sürüm için iş akışını yeniden çalıştırın.'; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Bu etiket zaten var: $tag"; exit 1
          else
            [[ $? == 2 ]] || exit 1
          fi
          cp "$asset" 'Etkin Otomasyon.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'Etkin Otomasyon.exe'
          git commit -m "build(windows): $version EXE dosyasını güncelle"
          git tag "$tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          gh release create "$tag" --verify-tag --latest \
            --title "Etkin Otomasyon $version" --generate-notes \
            "$asset" release-dist/SHA256SUMS.txt
          size=$(stat -c %s "$asset")
          digest="sha256:$(cut -d' ' -f1 release-dist/SHA256SUMS.txt)"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -e --arg digest "$digest" --argjson size "$size" \
            '.assets | any(.name == "Etkin-Otomasyon.exe" and .size == $size and .digest == $digest)'
